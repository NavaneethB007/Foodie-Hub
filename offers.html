<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Hub Offers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="offers.css">
</head>
<body>
<div class="container">
    <a href="hub.html" class="btn back-btn">
        ← Back to Home
    </a>
    <h1 class="text-center">
        Weekend Special – 20% OFF
    </h1>
    <p class="text-center offer-text">
        Grab your favourite dishes at special weekend prices!
    </p>
    <div class="row g-4 mt-3">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 text-center offer-card card1">
                <img src="images-3.jpeg" class="card-img-top" alt="Biriyani">
                <div class="card-body">
                    <h5 class="card-title">Biriyani</h5>
                    <p class="card-text">₹168</p>
                    <button class="btn btn-warning">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 text-center offer-card card2">
                <img src="images-5.jpeg" class="card-img-top" alt="Idli">
                <div class="card-body">
                    <h5 class="card-title">Idli</h5>
                    <p class="card-text">₹64</p>
                    <button class="btn btn-warning">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 text-center offer-card card3">
                <img src="images-7.jpeg" class="card-img-top" alt="Pizza">
                <div class="card-body">
                    <h5 class="card-title">Pizza</h5>
                    <p class="card-text">₹160</p>
                    <button class="btn btn-warning">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 text-center offer-card card4">

                <img src="images.jpeg" class="card-img-top" alt="Thali">

                <div class="card-body">
                    <h5 class="card-title">Thali</h5>
                    <p class="card-text">₹80</p>
                    <button class="btn btn-warning">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 text-center offer-card card5">
                <img src="images-8.jpeg" class="card-img-top" alt="Noodles">
                <div class="card-body">
                    <h5 class="card-title">Noodles</h5>
                    <p class="card-text">₹120</p>
                    <button class="btn btn-warning">Add to Cart</button>

            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 text-center offer-card card6">
                <img src="images-9.jpeg" class="card-img-top" alt="Sandwich">
                <div class="card-body">
                    <h5 class="card-title">Sandwich</h5>
                    <p class="card-text">₹96</p>

</html>
